name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.agents/**'
      - '.claude/**'
      - 'skills-lock.json'
  pull_request:
    paths-ignore:
      - '.agents/**'
      - '.claude/**'
      - 'skills-lock.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Chromium of the installed Playwright version, with the libraries it needs.
      - run: pnpm --filter @archdraft/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/e2e/.report/
            frontend/e2e/.results/
          retention-days: 14
          include-hidden-files: true

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build also checks the size budget of the initial JavaScript and CSS.
      - run: pnpm --filter @archdraft/web build

      # Three runs of the production build with the Google Chrome of the runner (lighthouserc.json).
      - run: pnpm --filter @archdraft/web test:lighthouse

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: frontend/.lighthouseci/
          retention-days: 14
          include-hidden-files: true
