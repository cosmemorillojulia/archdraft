<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Describe a cloud architecture in plain language and get an editable, reviewable diagram."
    />
    <title>Archdraft</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applies the saved or system theme before the first paint to avoid a flash.
      // Keep the storage key in sync with src/theme.ts.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('archdraft:theme');
        } catch {
          // Storage blocked by the browser: fall back to the system theme.
        }
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
