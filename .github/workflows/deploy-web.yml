name: Deploy web

# Publishes the editor to GitHub Pages once CI has passed on main, so that a
# commit that breaks the checks never reaches the public site.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl -sS -o pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pages")
          case "$status" in
            200)
              if [ "$(jq -r .build_type pages.json)" != "workflow" ]; then
                echo "::error::GitHub Pages must use GitHub Actions as its source (Settings > Pages > Source)."
                exit 1
              fi
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "::notice::GitHub Pages is not enabled, so the editor is not deployed. Set Settings > Pages > Source to GitHub Actions, see docs/operaciones.md."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected status $status from the GitHub Pages API."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        if: steps.pages.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/setup-node@v7
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.pages.outputs.enabled == 'true'

      - run: pnpm --filter web build
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
